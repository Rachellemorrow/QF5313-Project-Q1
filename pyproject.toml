[project]
name = "qf5313-group-project"
version = "0.1.0"
description = "QF5313 group environment; current agent scope is Question 1 only"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "plotly==7.1.0",
    "rich==15.0.0",
    "networkx==3.7",
    "akshare==1.20.27",
    "torch==2.15.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
required-version = "==0.13.7"
cache-dir = ".uv-cache"
no-build = true

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
cache_dir = ".pytest_cache"
